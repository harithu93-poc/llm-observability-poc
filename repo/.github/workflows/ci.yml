name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check app tests

      - name: Run tests
        run: pytest tests -v

  # Activates once app/Dockerfile exists (Week 1, Day 4) — builds the image
  # to confirm it compiles cleanly. Push-to-registry can be added later if
  # you want this deployed anywhere beyond local docker-compose.
