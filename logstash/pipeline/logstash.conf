input {
  file {
    path => "/logs/app.log"
    start_position => "beginning"
    # POC setting: always re-read from the start on restart instead of tracking
    # position via sincedb. Fine for dev/demo; remove this line for anything
    # long-running so Logstash doesn't reprocess the whole file every restart.
    sincedb_path => "/dev/null"
    codec => "json"
  }
}

filter {
  # Use the app's own request timestamp as the event time, not Logstash's ingest time.
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    remove_field => ["timestamp", "path", "host", "event"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "llm-observability-%{+YYYY.MM.dd}"
  }

  # Handy for debugging the pipeline itself — see events as they're processed.
  # Comment out once the pipeline is confirmed working, it's noisy long-term.
  stdout { codec => rubydebug }
}
